modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/CappleApple/stacksnotslots/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/CappleApple/stacksnotslots"
authors="CappleApple"
logoFile="assets/stacksnotslots/textures/gui/stacks-not-slots-logo.png"
logoBlur=false
description='''
A reusable API for inventories based on logical stacks and capacity rather than fixed slot geometry.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
